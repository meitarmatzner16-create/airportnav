name: Deploy web demo

# Publishes the Flutter web build to GitHub Pages so the portfolio QR code
# points at a permanent public URL. Runs on every push to the working branch,
# so the live demo never drifts from the repo.

on:
  push:
    branches: [main, 'redesign/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other onto Pages.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Pages serves the site from /<repo>/, so the base href has to match or
      # every asset request 404s.
      - name: Build web
        run: flutter build web --release --base-href /airportnav/

      # Safety net for deep links: Pages returns 404.html for unknown paths,
      # and serving index.html there lets the router take over.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
