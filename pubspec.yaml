name: airport_nav
description: "AirportNav - Airport Navigation App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_svg: ^2.0.17
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Launcher icons come from assets/icons/app_icon*.png, generated by
# tools/gen_app_icon.py from the same 64-unit geometry as
# lib/core/branding/logo_painter.dart - so icon and in-app mark never drift.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#3577E7"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/maps/
    - assets/mock/
